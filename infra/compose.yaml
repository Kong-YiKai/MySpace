name: myspace

x-myspace-labels: &myspace-labels
  com.myspace.project: "myspace"
  com.myspace.managed-by: "docker-compose"

services:
  postgres:
    image: myspace/postgres:17-alpine
    pull_policy: never
    container_name: myspace-postgres
    labels:
      <<: *myspace-labels
      com.myspace.service: "postgres"
    environment:
      POSTGRES_DB: spatial
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: spatial
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatial"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: myspace/nats:2.12-alpine
    pull_policy: never
    container_name: myspace-nats
    labels:
      <<: *myspace-labels
      com.myspace.service: "nats"
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  objectstore:
    image: myspace/rustfs:latest
    pull_policy: never
    container_name: myspace-rustfs
    labels:
      <<: *myspace-labels
      com.myspace.service: "objectstore"
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: spatial
      RUSTFS_SECRET_KEY: spatial-development-only
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "${MYSPACE_BROWSER_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: myspace-postgres-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "postgres-data"
  nats-data:
    name: myspace-nats-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "nats-data"
  rustfs-data:
    name: myspace-rustfs-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "rustfs-data"

networks:
  default:
    name: myspace-network
    labels:
      <<: *myspace-labels
      com.myspace.resource: "network"
