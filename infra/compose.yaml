name: myspace

x-myspace-labels: &myspace-labels
  com.myspace.project: "myspace"
  com.myspace.managed-by: "docker-compose"

services:
  postgres:
    image: myspace/postgres:17-alpine
    pull_policy: never
    container_name: myspace-postgres
    labels:
      <<: *myspace-labels
      com.myspace.service: "postgres"
    environment:
      POSTGRES_DB: spatial
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: spatial
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatial"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: myspace/nats:2.12-alpine
    pull_policy: never
    container_name: myspace-nats
    labels:
      <<: *myspace-labels
      com.myspace.service: "nats"
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: myspace/minio:latest
    pull_policy: never
    container_name: myspace-minio
    labels:
      <<: *myspace-labels
      com.myspace.service: "minio"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: spatial
      MINIO_ROOT_PASSWORD: spatial-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
    name: myspace-postgres-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "postgres-data"
  nats-data:
    name: myspace-nats-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "nats-data"
  minio-data:
    name: myspace-minio-data
    labels:
      <<: *myspace-labels
      com.myspace.resource: "minio-data"

networks:
  default:
    name: myspace-network
    labels:
      <<: *myspace-labels
      com.myspace.resource: "network"
